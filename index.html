<style>
  /* Layout concept: dashboard-inspired single page. A quiet hero with a sample analytics
     panel, then calm white cards on an off-white ground, closing on a deep navy footer. */
  :root {
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --ink: #1E293B;
    --mute: #64748B;
    --head: #14243A;
    --brand: #2563EB;
    --brand-ink: #1D4ED8;
    --teal: #14B8A6;
    --teal-ink: #0F766E;
    --line: #E2E8F0;
    --soft: #EEF3FA;
    --glow-a: rgba(37, 99, 235, 0.13);
    --glow-b: rgba(20, 184, 166, 0.16);
    --grid: rgba(20, 36, 58, 0.06);
    --header-bg: rgba(248, 250, 252, 0.85);
    --shadow: 0 1px 2px rgba(20, 36, 58, 0.05), 0 12px 28px -12px rgba(20, 36, 58, 0.16);
    --shadow-lift: 0 2px 4px rgba(20, 36, 58, 0.06), 0 22px 40px -16px rgba(20, 36, 58, 0.24);
    --foot-bg: #14243A;
    --foot-ink: #CBD5E1;
    --foot-line: rgba(203, 213, 225, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1424; --card: #101E33; --ink: #E2E8F0; --mute: #98A6BA; --head: #F1F5F9;
      --brand: #3B82F6; --brand-ink: #8DB8FF; --teal: #2DD4BF; --teal-ink: #5EEAD4;
      --line: #22324B; --soft: #0D1A2E;
      --glow-a: rgba(59, 130, 246, 0.16); --glow-b: rgba(45, 212, 191, 0.12);
      --grid: rgba(226, 232, 240, 0.05); --header-bg: rgba(10, 20, 36, 0.85);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -12px rgba(0, 0, 0, 0.55);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 22px 40px -16px rgba(0, 0, 0, 0.7);
      --foot-bg: #060E1B; --foot-ink: #B6C2D3; --foot-line: rgba(182, 194, 211, 0.16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1424; --card: #101E33; --ink: #E2E8F0; --mute: #98A6BA; --head: #F1F5F9;
    --brand: #3B82F6; --brand-ink: #8DB8FF; --teal: #2DD4BF; --teal-ink: #5EEAD4;
    --line: #22324B; --soft: #0D1A2E;
    --glow-a: rgba(59, 130, 246, 0.16); --glow-b: rgba(45, 212, 191, 0.12);
    --grid: rgba(226, 232, 240, 0.05); --header-bg: rgba(10, 20, 36, 0.85);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -12px rgba(0, 0, 0, 0.55);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.35), 0 22px 40px -16px rgba(0, 0, 0, 0.7);
    --foot-bg: #060E1B; --foot-ink: #B6C2D3; --foot-line: rgba(182, 194, 211, 0.16);
    color-scheme: dark;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* Paints the phone's top safe-area band so nothing shows above the sticky header. */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 40; background: var(--bg);
  }
  section[id] { scroll-margin-top: 84px; }
  @media (min-width: 1024px) { section[id] { scroll-margin-top: 0; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sr-only:focus-visible + label { outline: 3px solid var(--brand); outline-offset: 3px; }
  h1, h2, h3 { font-family: 'Sora', ui-sans-serif, system-ui, sans-serif; color: var(--head); text-wrap: balance; letter-spacing: -0.02em; }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .sec { padding-block: clamp(56px, 8vw, 96px); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 8px; }

  /* Header */
  .site-header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, #14243A 0%, #2563EB 100%);
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
    box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.6);
  }
  .nav-link {
    position: relative; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 600;
    color: var(--mute); transition: color .2s, background .2s;
  }
  .nav-link:hover { color: var(--head); background: var(--soft); }
  .nav-link[aria-current="true"] { color: var(--brand-ink); }
  .nav-link[aria-current="true"]::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--brand), var(--teal));
  }
  .icon-btn {
    display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--head); cursor: pointer;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px;
    border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; border: 1px solid transparent;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    text-decoration: none; line-height: 1.2;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: #2563EB; color: #fff; box-shadow: 0 10px 24px -10px rgba(37, 99, 235, 0.75); }
  .btn-primary:hover { background: #1D4ED8; box-shadow: 0 14px 28px -10px rgba(37, 99, 235, 0.8); }
  .btn-ghost { background: var(--card); color: var(--head); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--brand); color: var(--brand-ink); }
  .btn-sm { padding: 9px 14px; font-size: 14px; border-radius: 12px; }
  .btn[disabled], .btn[aria-disabled="true"] { cursor: not-allowed; opacity: .65; transform: none; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
    min-width: 0;
  }
  .card-hover { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card-hover:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--teal-ink);
  }
  .eyebrow::before { content: ""; width: 22px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--brand), var(--teal)); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px;
    font-weight: 600; background: var(--soft); color: var(--ink); border: 1px solid var(--line);
  }
  .chip-teal { color: var(--teal-ink); background: color-mix(in srgb, var(--teal) 12%, var(--card)); border-color: color-mix(in srgb, var(--teal) 30%, var(--line)); }
  .chip-note { color: var(--mute); }
  .ico {
    display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; flex: none; color: #fff;
    background: linear-gradient(135deg, #2563EB, #14B8A6);
    box-shadow: 0 8px 18px -8px rgba(37, 99, 235, 0.6);
  }
  .ico-soft { background: var(--soft); color: var(--brand-ink); box-shadow: none; border: 1px solid var(--line); }
  .muted { color: var(--mute); }

  /* Hero */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .hero-bg { position: absolute; inset: 0; pointer-events: none; }
  .hero-bg::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 70% 30%, #000 20%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 80% at 70% 30%, #000 20%, transparent 75%);
  }
  .hero-bg::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(520px 420px at 82% 18%, var(--glow-b), transparent 70%),
      radial-gradient(640px 480px at 12% 8%, var(--glow-a), transparent 70%);
  }
  .rise { animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .float { animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .portrait {
    position: relative; width: min(100%, 280px); aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden;
    background: linear-gradient(160deg, #14243A 0%, #1B3A63 55%, #0F766E 130%);
    box-shadow: 0 30px 60px -24px rgba(20, 36, 58, 0.55);
    display: grid; place-items: center; color: #fff;
  }
  .portrait::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .glass {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lift);
  }

  /* Sidebar */
  .sidebar {
    position: sticky; top: 0; align-self: start; height: 100vh; height: 100dvh; overflow-y: auto; flex-direction: column;
    padding: 36px 22px 24px; background: var(--card); border-right: 1px solid var(--line);
  }
  .side-photo {
    width: 148px; height: 148px; border-radius: 36px; overflow: hidden; display: grid; place-items: center;
    background: linear-gradient(160deg, #14243A 0%, #1B3A63 55%, #0F766E 130%);
    box-shadow: 0 18px 36px -16px rgba(20, 36, 58, 0.55); border: 3px solid var(--card); outline: 2px solid var(--line);
  }

  .about-photo {
    width: 100%; aspect-ratio: 4 / 5; border-radius: 28px; overflow: hidden; background: var(--soft);
    border: 1px solid var(--line); box-shadow: var(--shadow-lift);
  }

  /* Timeline */
  .timeline { position: relative; padding-left: 34px; }
  .timeline::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--brand), var(--teal)); border-radius: 2px; opacity: .5; }
  .dot { position: absolute; left: 0; top: 28px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 3px solid var(--brand); box-shadow: 0 0 0 6px color-mix(in srgb, var(--brand) 14%, transparent); }

  /* Forms */
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--head); margin-bottom: 6px; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit; font-size: 15px; transition: border-color .2s, box-shadow .2s;
  }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
  .input[aria-invalid="true"] { border-color: #DC2626; }
  .err { color: #B91C1C; font-size: 13px; margin-top: 5px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .err { color: #FCA5A5; } }
  :root[data-theme="dark"] .err { color: #FCA5A5; }

  /* Footer */
  .foot { background: var(--foot-bg); color: var(--foot-ink); }
  .foot h2, .foot h3 { color: #fff; }
  .foot a { color: var(--foot-ink); transition: color .2s; }
  .foot a:hover { color: #fff; }

  .skip { position: absolute; left: -999px; top: 8px; background: var(--brand); color: #fff; padding: 8px 14px; border-radius: 10px; z-index: 60; }
  .skip:focus { left: 16px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .rise, .float { animation: none; }
    .btn, .card-hover { transition: none; }
    .btn:hover, .card-hover:hover { transform: none; }
  }
</style>

    var mailto = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent(form.subject.trim()) + '&body=' + encodeURIComponent(body);
    var full = 'To: ' + EMAIL + '\nSubject: ' + form.subject.trim() + '\n\n' + body;
    return html`<form className="card p-6 sm:p-8 grid gap-5" onSubmit=${submit} noValidate aria-labelledby="form-title">
      <h3 id="form-title" className="font-display font-semibold text-xl">Send a message</h3>
      <div className="grid gap-5 sm:grid-cols-2">
        <${Field} name="name" label="Name" value=${form.name} onChange=${set('name')} error=${errors.name} auto="name" />
        <${Field} name="email" label="Email" type="email" value=${form.email} onChange=${set('email')} error=${errors.email} auto="email" />
      </div>
      <${Field} name="subject" label="Subject" value=${form.subject} onChange=${set('subject')} error=${errors.subject} />
      <${Field} name="message" label="Message" multiline=${true} value=${form.message} onChange=${set('message')} error=${errors.message} />
      <div><button type="submit" className="btn btn-primary">Prepare Message <${Icon} name="send" size=${17} /></button></div>
      ${ready && html`<div className="p-5 rounded-2xl" role="status" style=${{ background: 'color-mix(in srgb, var(--teal) 10%, var(--card))', border: '1px solid color-mix(in srgb, var(--teal) 35%, var(--line))' }}>
        <p className="font-semibold" style=${{ color: 'var(--head)' }}>Your message is ready, but nothing has been sent yet.</p>
        <p className="text-sm muted mt-1">This page cannot send email by itself. Open it in your email app, or copy it and send it to ${EMAIL}.</p>
        <pre className="mt-3 text-sm p-3 rounded-xl overflow-x-auto" style=${{ background: 'var(--bg)', border: '1px solid var(--line)', whiteSpace: 'pre-wrap', wordBreak: 'break-word', fontFamily: 'inherit' }}>${full}</pre>
        <div className="flex flex-wrap gap-3 mt-4">
          <a className="btn btn-primary btn-sm" href=${mailto}><${Icon} name="mail" size=${16} /> Open in email app</a>
          <${CopyButton} text=${full} label="Copy message" ariaLabel="Copy the message" />
        </div>
      </div>`}
    </form>`;
  }
  function Contact() {
    function Row(p) {
      return html`<li className="card p-5 flex items-center gap-4 flex-wrap">
        <span className="ico"><${Icon} name=${p.icon} /></span>
        <div className="min-w-0 flex-1" style=${{ minWidth: 160 }}>
          <p className="text-xs font-semibold muted uppercase" style=${{ letterSpacing: '.1em' }}>${p.label}</p>
          <p className="font-semibold break-words" style=${{ color: 'var(--head)', userSelect: 'all' }}>${p.value}</p>
        </div>
        ${p.children}
      </li>`;
    }
    return html`<section id="contact" className="sec gut" aria-labelledby="contact-title">
      <div className="wrap">
        <${Head} eyebrow="Contact" title=${html`<span id="contact-title">Let's talk about your data</span>`} sub="For roles, projects or questions, reach out by email, phone or the form." />
        <div className="grid gap-8 mt-10 xl:grid-cols-[0.9fr_1.1fr] items-start">
          <div className="grid gap-4 min-w-0">
            <ul className="grid gap-4">
              <${Row} icon="mail" label="Email" value=${EMAIL}>
                <div className="flex gap-2 flex-wrap">
                  <a className="btn btn-primary btn-sm" href=${'mailto:' + EMAIL}>Email Me</a>
                  <${CopyButton} text=${EMAIL} ariaLabel="Copy email address" />
                </div>
              <//>
              <${Row} icon="phone" label="Phone" value=${PHONE_DISPLAY}>
                <div className="flex gap-2 flex-wrap">
                  <a className="btn btn-primary btn-sm" href=${'tel:' + PHONE_TEL}>Call Me</a>
                  <${CopyButton} text=${PHONE_DISPLAY} ariaLabel="Copy phone number" />
                </div>
              <//>
              <${Row} icon="map-pin" label="Location" value="Bahawalnagar, Punjab, Pakistan" />
            </ul>
            <div className="card p-5">
              <p className="text-xs font-semibold muted uppercase" style=${{ letterSpacing: '.1em' }}>Social</p>
              <div className="flex flex-wrap gap-3 mt-3">
                <button type="button" className="btn btn-ghost btn-sm" aria-disabled="true" disabled><${Icon} name="linkedin" size=${16} /> LinkedIn · link coming soon</button>
                <button type="button" className="btn btn-ghost btn-sm" aria-disabled="true" disabled><${Icon} name="github" size=${16} /> GitHub · link coming soon</button>
              </div>
            </div>
          </div>
          <${ContactForm} />
        </div>
      </div>
    </section>`;
  }

  /* ---------- Footer ---------- */
  function Footer() {
    var year = new Date().getFullYear();
    return html`<footer className="foot gut">
      <div className="wrap" style=${{ paddingBlock: '56px 28px' }}>
        <div className="grid gap-10 md:grid-cols-[1.3fr_1fr_1fr]">
          <div>
            <div className="flex items-center gap-3">
              <span className="logo" aria-hidden="true">MY</span>
              <div className="leading-tight">
                <h2 className="font-display font-semibold text-lg">Mariam Yaseen</h2>
                <p className="text-sm">AI Financial Data Analyst</p>
              </div>
            </div>
          </div>
          <nav aria-label="Footer">
            <h3 className="font-display font-semibold text-sm mb-3" style=${{ letterSpacing: '.08em', textTransform: 'uppercase' }}>Quick links</h3>
            <ul className="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">
              ${NAV.map(function (n) { return html`<li key=${n[1]}><a href=${'#' + n[1]}>${n[0]}</a></li>`; })}
            </ul>
          </nav>
          <div>
            <h3 className="font-display font-semibold text-sm mb-3" style=${{ letterSpacing: '.08em', textTransform: 'uppercase' }}>Email</h3>
            <p className="text-sm break-words"><a href=${'mailto:' + EMAIL}>${EMAIL}</a></p>
          </div>
        </div>
        <p className="text-sm mt-10 pt-6" style=${{ borderTop: '1px solid var(--foot-line)' }}>© ${year} Mariam Yaseen. All rights reserved.</p>
      </div>
    </footer>`;
  }

  /* ---------- App ---------- */
  function App() {
    var st = useState('home'), active = st[0], setActive = st[1];
    var th = useTheme(), theme = th[0], toggleTheme = th[1];
    var ps = useState(PHOTO), photo = ps[0], setPhoto = ps[1];
    function onPhoto(e) {
      var f = e.target.files && e.target.files[0];
      if (f && /^image\//.test(f.type)) setPhoto(URL.createObjectURL(f));
      e.target.value = '';
    }
    useEffect(function () {
      if (!('IntersectionObserver' in window)) return;
      var ids = NAV.map(function (n) { return n[1]; });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) setActive(en.target.id); });
      }, { rootMargin: '-45% 0px -50% 0px' });
      ids.forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
      return function () { io.disconnect(); };
    }, []);
    return html`<${React.Fragment}>
      <${Nav} active=${active} theme=${theme} onToggle=${toggleTheme} />
      <div className="lg:grid lg:grid-cols-[288px_minmax(0,1fr)]">
        <${Sidebar} active=${active} photo=${photo} onPhoto=${onPhoto} theme=${theme} onToggle=${toggleTheme} />
        <main id="main" style=${{ minWidth: 0 }}>
          <${Hero} photo=${photo} />
          <${About} />
          <${Education} />
          <${Skills} />
          <${Languages} />
          <${Contact} />
        </main>
      </div>
      <${Footer} />
    <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>

</body></html>
